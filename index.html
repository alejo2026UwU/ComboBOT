<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComboBOT — El Bot Definitivo 🚀</title>
    <style>
        :root {
            --bg-main: #060b13;
            --bg-card: #0b1524;
            --neon-green: #39e680;
            --accent-red: #ff4a5a;
        }
        body {
            background-color: var(--bg-main);
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .hero { max-width: 800px; padding: 40px; }
        h1 { font-size: 3.5rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        h1 span.green { color: var(--neon-green); text-shadow: 0 0 20px rgba(57, 230, 128, 0.3); }
        h1 span.red { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 74, 90, 0.3); }
        p { font-size: 1.2rem; color: #8fa0b5; margin-bottom: 40px; }
        .btn-group { display: flex; gap: 20px; justify-content: center; }
        .btn { padding: 15px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; text-decoration: none; transition: 0.3s; cursor: pointer; }
        .btn-panel { background-color: var(--neon-green); color: #060b13; box-shadow: 0 4px 15px rgba(57, 230, 128, 0.4); }
        .btn-panel:hover { background-color: #2cc96e; transform: translateY(-3px); }
        .btn-invite { background-color: transparent; color: white; border: 2px solid var(--accent-red); box-shadow: 0 4px 15px rgba(255, 74, 90, 0.2); }
        .btn-invite:hover { background-color: var(--accent-red); transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🤖 <span class="green">Combo</span><span class="red">BOT</span></h1>
        <p>Música gratis 24/7, creador de memes instantáneo y una lista masiva de 100 minijuegos interactivos para tu servidor de Discord.</p>
        <div class="btn-group">
            <a href="/server_panel.html" class="btn btn-panel">👑 Ir al Dashboard</a>
            <a href="https://discord.com" target="_blank" class="btn btn-invite">🚀 Invitar al Bot</a>
        </div>
    </div>
</body>
</html>
